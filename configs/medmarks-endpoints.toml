[endpoint.orchestrate.vllm.serve]
max_num_batched_tokens = 32768
max_num_seqs = 512
mamba_ssm_cache_dtype = "float32"
quantization = "experts_int8"
tool_call_parser = "hermes"

[endpoint.orchestrate.container]
image = "vllm/vllm-openai:v0.12.0"
container_port = 8000
ipc_mode = "host"


