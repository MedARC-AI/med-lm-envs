# MedMarks model alias registry.
# Endpoint entries may include MedARC [endpoint.orchestrate] blocks for local vLLM orchestration.
# URL, key, and max_concurrent are intentionally omitted; supply deployment-specific API settings at runtime.

[[endpoint]]
endpoint_id = "afm-4.5b"
model = "arcee-ai/AFM-4.5B"
api_client_type = "openai_chat_completions"

[endpoint.sampling_args]
temperature = 0.5
top_p = 0.95
top_k = 50

[endpoint.orchestrate.vllm]
gpus = 1

[endpoint.orchestrate.vllm.serve]
max_num_batched_tokens = 32768
max_num_seqs = 768
tool_call_parser = "hermes"

[endpoint.orchestrate.container]
image = "vllm/vllm-openai:latest"
container_port = 8000
ipc_mode = "host"


[[endpoint]]
endpoint_id = "ai21-jamba2-mini"
