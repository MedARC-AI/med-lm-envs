[[eval]]
env_id = "medec"
num_examples = -1
rollouts_per_example = 1
env_args = { judge_model = ["openai/gpt-5-mini", "google/gemini-3-flash-preview"], judge_base_url = "https://api.pinference.ai/api/v1" }

[[eval]]
env_id = "medexqa"
num_examples = -1
rollouts_per_example = 1
