# Bedrock model endpoint aliases for medmarks.
#
# Usage:
#   uv run medarc-eval medqa \
#     -m nova-pro \
#     --endpoints-path configs/medmarks-endpoints-bedrock.toml \
#     --provider bedrock \
#     -n 25
#
# To use a specific AWS profile:
#   uv run medarc-eval medqa \
#     -m nova-pro \
#     --endpoints-path configs/medmarks-endpoints-bedrock.toml \
#     --provider bedrock \
#     --api-key-var AWS_PROFILE \
#     -n 25
#
# To use a different region:
#   --api-base-url region:us-west-2

# --- Amazon Nova ---

[[endpoint]]
endpoint_id = "nova-pro"
model = "us.amazon.nova-pro-v1:0"
api_client_type = "bedrock_converse"
[endpoint.sampling_args]
temperature = 0.7
top_p = 0.9

