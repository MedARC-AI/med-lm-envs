[project]
name = "medfact-bench"
version = "0.1.0"
description = "Paper-faithful zero-shot evaluation and reporting for MedFact-Bench"
authors = [
    { name = "Kouate Muhamed", email = "muhamed.kouate@icloud.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "medarc-verifiers>=0.2.0",
    "verifiers>=0.1.14,<0.2",
    "datasets>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medfact_bench"]

[tool.prime.environment]
loader = "medfact_bench:load_environment"
display_name = "MedFact-Bench"
visibility = "PUBLIC"

[tool.verifiers.eval]
num_examples = -1
rollouts_per_example = 1
