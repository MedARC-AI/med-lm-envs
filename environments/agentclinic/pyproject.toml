[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentclinic"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "medarc-verifiers>=0.1.0",
    "verifiers>=0.1.12,<0.2",
    "datasets",
]

[project.entry-points."verifiers.environments"]
agentclinic = "agentclinic:load_environment"
