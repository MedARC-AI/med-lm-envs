[project]
name = "medcasereasoning"
version = "0.1.1"
description = "MedCaseReasoning medical diagnosis evaluation"
tags = ["medical", "reasoning", "single-turn", "llm-judge", "diagnosis"]
dependencies = [
    "medarc-verifiers>=0.1.0",
    "verifiers>=0.1.12,<0.2",
    "datasets",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["medcasereasoning.py"]